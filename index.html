<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cloud Leap: Endless Path</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #222;
    }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
    }
    #container {
      position: relative;
      width: 400px;
      height: 600px;
    }
    #game {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      touch-action: none;
    }
    #ui {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      touch-action: none;
    }
    @media (max-width: 500px) {
      #container {
        width: 100vw;
        height: 100vh;
      }
    }
  </style>
</head>

    <canvas id="game" width="400" height="600"></canvas>
    <canvas id="ui" width="400" height="600"></canvas>

    let jumpsTotal = Number(localStorage.getItem('jumpsTotal') || 0);

    const SKINS = [
      { id: 'default', name: 'Default', price: 0, img: playerImg },
      { id: 'plakish', name: 'Plakish', price: 50, img: skinPlakishImg },
      { id: 'panda', name: 'Panda', price: 75, img: skinPandaImg },
      { id: 'pumpkin', name: 'Pumpkin', price: 75, img: skinPumpkinImg },
      { id: 'lolya', name: 'Lolya', price: 75, img: skinLolyaImg },
      { id: 'apelsinka', name: 'Apelsinka', price: 75, img: skinApelsinkaImg },

    function saveSkins() {
      localStorage.setItem('ownedSkins', JSON.stringify(ownedSkins));
      localStorage.setItem('selectedSkin', selectedSkin);
    }

    function getCurrentPlayerImage() {
      if (selectedSkin === 'kitty' && nightAlpha > 0.5) {

      for (const s of SKINS) {

      return selectedSkin === 'kitty';

      localStorage.setItem('musicVolume', musicVolume);
      localStorage.setItem('soundVolume', soundVolume);

      localStorage.setItem('gamesPlayed', gamesPlayed);
      localStorage.setItem('jumpsTotal', jumpsTotal);
      localStorage.setItem('coinsTotal', coinsTotal);
      if (firstPlayDate) localStorage.setItem('firstPlayDate', firstPlayDate);

    function formatDate(iso) {
      if (!iso) return '—';
      const d = new Date(iso);
      if (isNaN(d.getTime())) return '—';
      const dd = String(d.getDate()).padStart(2, '0');
      const mm = String(d.getMonth() + 1).padStart(2, '0');
      const yyyy = d.getFullYear();
      return dd + '.' + mm + '.' + yyyy;
    }

    let musicOn = true;

    const music = new Audio();
    music.loop = true;
    music.volume = musicVolume;

      music.src = TRACKS[index];
    }

    function playTrack(index) {
      music.src = TRACKS[index];
      if (musicStarted && musicOn) {

    let audioCtx = null;

    function ensureAudioCtx() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      return audioCtx;
    }

    function playJumpSound() {
      if (soundVolume <= 0) return;
      const ac = ensureAudioCtx();
      const osc = ac.createOscillator();
      const gain = ac.createGain();

      osc.type = 'sine';
      osc.frequency.setValueAtTime(400, ac.currentTime);
      osc.frequency.exponentialRampToValueAtTime(150, ac.currentTime + 0.15);

      gain.gain.setValueAtTime(0.1 * soundVolume, ac.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + 0.15);

      osc.connect(gain);
      gain.connect(ac.destination);

      osc.start();
      osc.stop(ac.currentTime + 0.15);
    }

    function playSpringSound() {
      if (soundVolume <= 0) return;
      if (isKittySelected()) {
        meowSpringSound.volume = soundVolume;
        meowSpringSound.currentTime = 0;
        meowSpringSound.play().catch(() => {});
        return;
      }
      const ac = ensureAudioCtx();
      const osc = ac.createOscillator();
      const gain = ac.createGain();

      osc.type = 'sine';
      osc.frequency.setValueAtTime(200, ac.currentTime);
      osc.frequency.exponentialRampToValueAtTime(800, ac.currentTime + 0.2);

      gain.gain.setValueAtTime(0.15 * soundVolume, ac.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + 0.25);

      osc.connect(gain);
      gain.connect(ac.destination);

      osc.start();
      osc.stop(ac.currentTime + 0.25);
    }

    function playGameOverSound() {
      if (soundVolume <= 0) return;
      const ac = ensureAudioCtx();
      const osc = ac.createOscillator();
      const gain = ac.createGain();

      osc.type = 'sine';
      osc.frequency.setValueAtTime(400, ac.currentTime);
      osc.frequency.exponentialRampToValueAtTime(100, ac.currentTime + 0.8);

      gain.gain.setValueAtTime(0.15 * soundVolume, ac.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + 0.8);

      osc.connect(gain);
      gain.connect(ac.destination);

      osc.start();
      osc.stop(ac.currentTime + 0.8);
    }

    function playSpikeSound() {
      if (soundVolume <= 0) return;
      if (isKittySelected()) {
        meowSpikeSound.volume = soundVolume;
        meowSpikeSound.currentTime = 0;
        meowSpikeSound.play().catch(() => {});
        return;
      }
      const ac = ensureAudioCtx();
      const osc = ac.createOscillator();
      const gain = ac.createGain();

      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(600, ac.currentTime);
      osc.frequency.exponentialRampToValueAtTime(90, ac.currentTime + 0.5);

      gain.gain.setValueAtTime(0.2 * soundVolume, ac.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + 0.55);

      osc.connect(gain);
      gain.connect(ac.destination);

      osc.start();
      osc.stop(ac.currentTime + 0.55);
    }

    function playRecordSound() {
      if (soundVolume <= 0) return;
      const ac = ensureAudioCtx();
      const notes = [400, 500, 600, 800];
      const duration = 0.1;

      for (let i = 0; i < notes.length; i++) {
        const osc = ac.createOscillator();
        const gain = ac.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(notes[i], ac.currentTime + i * duration);

        const startTime = ac.currentTime + i * duration;
        gain.gain.setValueAtTime(0.15 * soundVolume, startTime);
        gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);

        osc.connect(gain);
        gain.connect(ac.destination);

        osc.start(startTime);
        osc.stop(startTime + duration);
      }
    }

    function playClickSound() {
      if (soundVolume <= 0) return;
      const ac = ensureAudioCtx();
      const osc = ac.createOscillator();
      const gain = ac.createGain();

      osc.type = 'sine';
      osc.frequency.setValueAtTime(800, ac.currentTime);
      osc.frequency.exponentialRampToValueAtTime(400, ac.currentTime + 0.08);

      gain.gain.setValueAtTime(0.08 * soundVolume, ac.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + 0.08);

      osc.connect(gain);
      gain.connect(ac.destination);

      osc.start();
      osc.stop(ac.currentTime + 0.08);
    }

    function playCoinSound() {
      if (soundVolume <= 0) return;
      const ac = ensureAudioCtx();
      const osc = ac.createOscillator();
      const gain = ac.createGain();

      osc.type = 'sine';
      osc.frequency.setValueAtTime(880, ac.currentTime);
      osc.frequency.exponentialRampToValueAtTime(1320, ac.currentTime + 0.08);
      osc.frequency.exponentialRampToValueAtTime(1760, ac.currentTime + 0.15);

      gain.gain.setValueAtTime(0.12 * soundVolume, ac.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + 0.2);

      osc.connect(gain);
      gain.connect(ac.destination);

      osc.start();
      osc.stop(ac.currentTime + 0.2);
    }

    function playBuySound() {
      if (soundVolume <= 0) return;
      const ac = ensureAudioCtx();
      const notes = [523, 659, 784];
      const duration = 0.12;

      for (let i = 0; i < notes.length; i++) {
        const osc = ac.createOscillator();
        const gain = ac.createGain();

        osc.type = 'triangle';
        osc.frequency.setValueAtTime(notes[i], ac.currentTime + i * duration);

        const startTime = ac.currentTime + i * duration;
        gain.gain.setValueAtTime(0.15 * soundVolume, startTime);
        gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);

        osc.connect(gain);
        gain.connect(ac.destination);

        osc.start(startTime);
        osc.stop(startTime + duration);
      }
    }

    function getPhaseColors(phase) {
      const phases = [
        ['#3d7ec0', '#5ba8d4', '#7fc4e0', '#9dd4e8', '#b8e0f0'],
        ['#1a1a3e', '#4a2a6e', '#d94a7e', '#ff8c42', '#ffd166'],
        ['#0a0a2e', '#1a1a4e', '#2c2c5e', '#4a3f6e', '#6b5b95'],
        ['#1a1a3e', '#4a2a6e', '#d94a7e', '#ff8c42', '#ffd166']
      ];
      return phases[phase % 4];
    }

    function getMenuPhase() {
      const h = new Date().getHours();
      if (h >= 6 && h < 12) return 1;
      if (h >= 12 && h < 18) return 0;
      if (h >= 18) return 1;
      return 2;

    const CONFIRM_W = 320;
    const CONFIRM_H = 200;
    const CONFIRM_X = (400 - CONFIRM_W) / 2;
    const CONFIRM_Y = (600 - CONFIRM_H) / 2 - 40;

    const CONFIRM_BTN_W = 120;
    const CONFIRM_BTN_H = 50;
    const CONFIRM_BTN_Y = CONFIRM_Y + CONFIRM_H - 70;
    const CONFIRM_YES_X = CONFIRM_X + 30;
    const CONFIRM_NO_X = CONFIRM_X + CONFIRM_W - 30 - CONFIRM_BTN_W;

    function getConfirmText() {
      if (pendingConfirm === 'resetSound') {
        return 'Reset sound settings\nto defaults?';
      }
      if (pendingConfirm === 'resetRecord') {
        return 'Reset best score to 0?';
      }
      if (pendingConfirm === 'buySkin') {
        const skin = SKINS.find(s => s.id === pendingBuySkinId);
        if (skin) return 'Buy ' + skin.name + ' for ' + skin.price + ' coins?';
        return 'Buy skin?';
      }
      return '';
    }

    function confirmYes() {
      if (pendingConfirm === 'resetSound') {
        musicVolume = 0.3;
        soundVolume = 1.0;
        currentTrack = 0;
        music.volume = musicVolume;
        playTrack(currentTrack);
        saveVolumes();
      } else if (pendingConfirm === 'resetRecord') {
        highScore = 0;
        localStorage.setItem('highScore', 0);
      } else if (pendingConfirm === 'buySkin') {
        const skin = SKINS.find(s => s.id === pendingBuySkinId);
        if (skin && coinsTotal >= skin.price && !ownedSkins.includes(skin.id)) {
          coinsTotal = coinsTotal - skin.price;
          ownedSkins.push(skin.id);
          selectedSkin = skin.id;
          saveStats();
          saveSkins();
          playBuySound();
        }
      }
      pendingConfirm = null;
      pendingBuySkinId = null;
    }

    function confirmNo() {
      pendingConfirm = null;
      pendingBuySkinId = null;
    }

    function isOverConfirmYes(mx, my) {
      return mx >= CONFIRM_YES_X && mx <= CONFIRM_YES_X + CONFIRM_BTN_W &&
             my >= CONFIRM_BTN_Y && my <= CONFIRM_BTN_Y + CONFIRM_BTN_H;
    }

    function isOverConfirmNo(mx, my) {
      return mx >= CONFIRM_NO_X && mx <= CONFIRM_NO_X + CONFIRM_BTN_W &&
             my >= CONFIRM_BTN_Y && my <= CONFIRM_BTN_Y + CONFIRM_BTN_H;
    }

    function createStars() {
      stars = [];
      for (let i = 0; i < 60; i++) {
        stars.push({
          x: Math.random() * 400,
          y: Math.random() * 600,
          size: 0.5 + Math.random() * 2,
          alpha: 0.3 + Math.random() * 0.7,
          flickerOffset: Math.random() * Math.PI * 2
        });
      }
    }

    function createClouds() {
      clouds = [];
      for (let i = 0; i < 8; i++) {
        clouds.push({
          x: Math.random() * 500 - 50,
          y: 450 + Math.random() * 150,
          size: 60 + Math.random() * 60,
          speed: 0.2 + Math.random() * 0.4,
          alpha: 0.15 + Math.random() * 0.15
        });
      }

      bgClouds = [];
      for (let i = 0; i < 12; i++) {
        bgClouds.push({
          x: Math.random() * 500 - 50,
          y: 100 + Math.random() * 400,
          size: 100 + Math.random() * 80,
          speed: -0.05 - Math.random() * 0.05,
          alpha: 0.05 + Math.random() * 0.05
        });
      }
    }

    function updateClouds(delta) {
      for (let bgCloud of bgClouds) {
        bgCloud.x = bgCloud.x + bgCloud.speed * 60 * delta;
        if (bgCloud.x < -150) {
          bgCloud.x = 450;
          bgCloud.y = 100 + Math.random() * 400;
        } else if (bgCloud.x > 450) {
          bgCloud.x = -150;
          bgCloud.y = 100 + Math.random() * 400;
        }
      }

      for (let cloud of clouds) {
        cloud.x = cloud.x + cloud.speed * 60 * delta;
        if (cloud.x > 450) {
          cloud.x = -100;
          cloud.y = 450 + Math.random() * 150;
        }
      }
    }

    function drawClouds(c) {
      for (let bgCloud of bgClouds) {
        c.globalAlpha = bgCloud.alpha;
        c.drawImage(platformImg, bgCloud.x, bgCloud.y, bgCloud.size, 20);
      }
      c.globalAlpha = 1;

      for (let cloud of clouds) {
        c.globalAlpha = cloud.alpha;
        c.fillStyle = 'white';
        c.beginPath();
        c.arc(cloud.x, cloud.y, cloud.size / 2, 0, Math.PI * 2);
        c.arc(cloud.x + cloud.size / 3, cloud.y - cloud.size / 5, cloud.size / 2.5, 0, Math.PI * 2);
        c.arc(cloud.x - cloud.size / 3, cloud.y - cloud.size / 5, cloud.size / 2.5, 0, Math.PI * 2);
        c.fill();
      }
      c.globalAlpha = 1;
    }

    function drawMenuBackground(c) {
      const phase = getMenuPhase();
      const colors = getPhaseColors(phase);
      const grad = c.createLinearGradient(0, 0, 0, 600);
      grad.addColorStop(0, colors[0]);
      grad.addColorStop(0.3, colors[1]);
      grad.addColorStop(0.55, colors[2]);
      grad.addColorStop(0.8, colors[3]);
      grad.addColorStop(1, colors[4]);
      c.fillStyle = grad;
      c.fillRect(0, 0, 400, 600);

      if (phase === 2) {
        for (let s of stars) {
          const flicker = 0.6 + Math.sin(Date.now() * 0.003 + s.flickerOffset) * 0.4;
          const starAlpha = s.alpha * 0.8 * flicker;
          c.beginPath();
          c.arc(s.x, s.y, s.size, 0, Math.PI * 2);
          c.fillStyle = 'rgba(255, 255, 255, ' + starAlpha + ')';
          c.fill();
        }
      }
    }

    function spawnShootingStar() {
      shootingStars.push({
        x: Math.random() * 400,
        y: -20,
        vx: -2 - Math.random() * 2,
        vy: 2 + Math.random() * 2,
        length: 40 + Math.random() * 40,
        life: 1
      });
    }

    function startRain() {
      isRaining = true;
      rainTimer = 2400;
      rainDrops = [];

      for (let i = 0; i < 80; i++) {
        rainDrops.push({
          x: Math.random() * 450 - 50,
          y: Math.random() * 600,
          speed: 8 + Math.random() * 6,
          length: 10 + Math.random() * 10,
          alpha: 0.3 + Math.random() * 0.4
        });
      }

      if (Math.random() < 0.5) {
        eventActive = true;

        const fromSide = Math.random() < 0.5;

        if (fromSide) {
          eventX = -80;
          eventY = 100 + Math.random() * 400;
          eventVX = 0.4 + Math.random() * 0.4;
          eventVY = 0.2 + Math.random() * 0.4;
        } else {
          eventX = Math.random() * 400;
          eventY = -80;
          eventVX = -0.4 + Math.random() * 0.8;
          eventVY = 0.3 + Math.random() * 0.5;
        }

        eventSize = 60;
      }
    }

    function stopRain() {
      isRaining = false;
      rainDrops = [];
      rainCooldown = 1200;
    }

    function makePlatform(px, py) {
      return {
        x: px,
        y: py,
        width: PLATFORM_W,
        spring: Math.random() < 0.1,
        hasCoin: false,
        spike: false,
        isMoving: false,
        vx: 0,
        bobPhase: Math.random() * Math.PI * 2,
        collected: false,
        squash: 0,
        spawnProgress: 0
      };
    }

    function createPlatform(y, prevX) {
      platformCounter++;

      let newX;
      let forcedByCenter = false;

      if (pendingCenterX >= 0) {
        newX = pendingCenterX - PLATFORM_W / 2;
        if (newX < 0) newX = 0;
        if (newX > 290) newX = 290;
        pendingCenterX = -1;
        forcedByCenter = true;
      } else {
        if (Math.random() < 0.75) {
          lastSide = -lastSide;
        }
        let distance = 110 + Math.random() * 70;
        if (Math.random() < 0.3) {
          distance = 140 + Math.random() * 40;
        }
        newX = prevX + lastSide * distance;
        if (newX < 0) newX = 0;
        if (newX > 290) newX = 290;

        const prevCenter = prevX + PLATFORM_W / 2;
        const newCenter = newX + PLATFORM_W / 2;
        if (Math.abs(prevCenter - newCenter) < 80) {
          let tryX = prevX + 110;
          if (tryX > 290) tryX = prevX - 110;
          if (tryX < 0) tryX = 0;
          if (tryX > 290) tryX = 290;
          newX = tryX;
          lastSide = (newX > prevX) ? 1 : -1;
        }
      }

      const canSpawnCoin = (platformCounter - lastCoinPlatformNum) >= 5;

      if (!forcedByCenter && spawnCooldown > 0) {
        spawnCooldown--;
      }

      if (!forcedByCenter && spawnCooldown === 0 && Math.random() < 0.15) {
        const prevPlatform = platforms[platforms.length - 1];
        if (prevPlatform) {
          const centerX = prevPlatform.x + prevPlatform.width / 2;
          const gap = 100 + Math.random() * 40;

          const p1X = centerX - gap / 2 - PLATFORM_W;
          const p2X = centerX + gap / 2;

          if (p1X >= 0 && p2X + PLATFORM_W <= 400) {
            const p1 = makePlatform(p1X, y);
            const p2 = makePlatform(p2X, y);

            if (Math.random() < 0.25) {
              const spikeP = (Math.random() < 0.5) ? p1 : p2;
              const safeP = (spikeP === p1) ? p2 : p1;

              spikeP.spike = true;
              spikeP.width = PLATFORM_W;
              spikeP.spring = false;
              spikeP.hasCoin = false;

              if (canSpawnCoin) {
                const dx = Math.abs(safeP.x - prevX);
                let d = (dx - 80) / 170;
                if (d < 0) d = 0;
                if (d > 1) d = 1;
                const chance = 0.05 + d * 0.20;
                if (Math.random() < chance) {
                  safeP.hasCoin = true;
                  lastCoinPlatformNum = platformCounter;
                }
              }
            } else {
              if (canSpawnCoin && Math.random() < 0.35) {
                const dist1 = Math.abs(p1.x - prevX);
                const dist2 = Math.abs(p2.x - prevX);
                const farP = (dist1 > dist2) ? p1 : p2;
                farP.hasCoin = true;
                lastCoinPlatformNum = platformCounter;
              }
            }

            pendingCenterX = centerX;
            return [p1, p2];
          }
        }
      }

      const p = makePlatform(newX, y);

      if (!forcedByCenter && spawnCooldown === 0 && Math.random() < 0.08) {
        p.isMoving = true;
        p.vx = (Math.random() < 0.5 ? -1 : 1) * 80;
        p.originX = newX;
        spawnCooldown = 10;
      }

      if (!p.isMoving && canSpawnCoin) {
        const dx = Math.abs(newX - prevX);
        let d = (dx - 80) / 170;
        if (d < 0) d = 0;
        if (d > 1) d = 1;
        const chance = 0.05 + d * 0.20;

        if (Math.random() < chance) {
          p.hasCoin = true;
          lastCoinPlatformNum = platformCounter;
        }
      }

      if (!p.isMoving) {
        p.spring = Math.random() < 0.1;
      }

      return [p];
    }

    function resetGame() {
      score = 0;
      platforms = [];
      particles = [];
      juiceParticles = [];
      floatingTexts = [];
      lastSide = -1;
      gameOver = false;
      paused = false;
      pauseAnimTime = 0;
      canvas.style.filter = 'none';
      uiCtx.clearRect(0, 0, 400, 600);

      platformCounter = 0;
      lastCoinPlatformNum = -100;
      pendingCenterX = -1;
      spawnCooldown = 0;
      
      startHighScore = highScore;
      recordTextShown = false;
      
      lemonLandTime = -100;
      lemonJumpTime = -100;

      createStars();
      createClouds();
      shootingStars = [];
      isRaining = false;
      rainDrops = [];
      rainCooldown = 0;
      rainTimer = 0;
      showRainbow = false;
      rainbowAlpha = 0;
      rainbowTimer = 0;
      eventActive = false;

      startPhase = Math.floor(Math.random() * 4);
      currentPhase = startPhase;
      targetPhase = startPhase;
      phaseTransition = 0;

      for (let i = 0; i < 8; i++) {
        let prevX = 150;
        if (platforms.length > 0) {
          prevX = platforms[platforms.length - 1].x;
        }
        const created = createPlatform(540 - i * 80, prevX);
        for (const p of created) platforms.push(p);
      }
      platforms.sort((a, b) => b.y - a.y);
      x = platforms[0].x + 15;
      y = platforms[0].y - 50;
      vy = 0;
      keys = {};

      if (!firstPlayDate) {
        firstPlayDate = new Date().toISOString();
        saveStats();
      }
    }

    let keys = {};
    document.addEventListener('keydown', e => keys[e.key] = true);
    document.addEventListener('keyup', e => keys[e.key] = false);
    window.addEventListener('blur', () => { keys = {}; });

    let musicStarted = false;
    function startMusic() {
      if (!musicStarted) {
        music.volume = musicVolume;
        music.play().catch(() => {});

        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }

        musicStarted = true;
      }
    }

    document.addEventListener('keydown', () => { startMusic(); });

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        if (document.documentElement.requestFullscreen) {
          document.documentElement.requestFullscreen();
        } else if (document.documentElement.webkitRequestFullscreen) {
          document.documentElement.webkitRequestFullscreen();
        } else if (document.documentElement.msRequestFullscreen) {
          document.documentElement.msRequestFullscreen();
        }
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        } else if (document.webkitExitFullscreen) {
          document.webkitExitFullscreen();
        } else if (document.msExitFullscreen) {
          document.msExitFullscreen();
        }
      }
    }

    function getCanvasCoords(clientX, clientY) {
      const rect = canvas.getBoundingClientRect();
      return {
        mx: (clientX - rect.left) / rect.width * canvas.width,
        my: (clientY - rect.top) / rect.height * canvas.height
      };
    }

    function pointToSliderValue(mx) {
      let v = (mx - SLIDER_X) / SLIDER_W;
      if (v < 0) v = 0;
      if (v > 1) v = 1;
      return v;
    }

    function isOnSlider(mx, my, y) {
      return mx >= SLIDER_X - 15 && mx <= SLIDER_X + SLIDER_W + 15 &&
             my >= y - 20 && my <= y + 20;
    }

    function getSkinCardRect(i) {
      const col = i % 3;
      const row = Math.floor(i / 3);
      const x = SKIN_ROW_X + col * (SKIN_CARD_W + SKIN_CARD_GAP);
      const y = SKIN_CARD_Y + row * (SKIN_CARD_H + SKIN_CARD_GAP) + skinScrollY;
      return { x: x, y: y, w: SKIN_CARD_W, h: SKIN_CARD_H };
    }

    function handleSkinsTap(mx, my) {
      if (pendingConfirm !== null) {
        if (isOverConfirmYes(mx, my)) {
          playClickSound();
          confirmYes();
          return true;
        }
        if (isOverConfirmNo(mx, my)) {
          playClickSound();
          confirmNo();
          return true;
        }
        return true;
      }

      if (mx >= 100 && mx <= 300 && my >= 510 && my <= 570) {
        playClickSound();
        inSkins = false;
        inMenu = true;
        return true;
      }

      for (let i = 0; i < SKINS.length; i++) {
        const card = getSkinCardRect(i);
        if (mx >= card.x && mx <= card.x + card.w &&
            my >= card.y && my <= card.y + card.h) {
          const skin = SKINS[i];
          if (ownedSkins.includes(skin.id)) {
            playClickSound();
            selectedSkin = skin.id;
            saveSkins();
          } else {
            if (coinsTotal >= skin.price) {
              playClickSound();
              pendingConfirm = 'buySkin';
              pendingBuySkinId = skin.id;
            } else {
              playClickSound();
              soonShown = true;
              soonTimer = 40;
            }
          }
          return true;
        }
      }

      return false;
    }

    function handleSettingsTap(mx, my) {
      if (pendingConfirm !== null) {
        if (isOverConfirmYes(mx, my)) {
          playClickSound();
          confirmYes();
          return true;
        }
        if (isOverConfirmNo(mx, my)) {
          playClickSound();
          confirmNo();
          return true;
        }
        return true;
      }

      if (mx >= 100 && mx <= 300 && my >= 510 && my <= 570) {
        playClickSound();
        inSettings = false;

        if (settingsReturnScene === 'game') {
          paused = true;
          pauseAnimTime = 0;
          canvas.style.filter = 'blur(6px) brightness(0.6)';
          music.volume = musicVolume * 0.33;
        } else {
          inMenu = true;
        }
        settingsReturnScene = 'menu';
        return true;
      }

      if (my >= TAB_Y && my <= TAB_Y + TAB_H) {
        if (mx >= TAB_SOUND_X && mx <= TAB_SOUND_X + TAB_W) {
          playClickSound();
          settingsTab = 'sound';
          return true;
        } else if (mx >= TAB_DATA_X && mx <= TAB_DATA_X + TAB_W) {
          playClickSound();
          settingsTab = 'data';
          return true;
        } else if (mx >= TAB_ABOUT_X && mx <= TAB_ABOUT_X + TAB_W) {
          playClickSound();
          settingsTab = 'about';
          return true;
        }
      }

      if (settingsTab === 'sound') {
        if (isOnSlider(mx, my, MUSIC_SLIDER_Y)) {
          draggingSlider = 'music';
          musicVolume = pointToSliderValue(mx);
          music.volume = musicVolume;
          saveVolumes();
          return true;
        }
        if (isOnSlider(mx, my, SOUND_SLIDER_Y)) {
          draggingSlider = 'sound';
          soundVolume = pointToSliderValue(mx);
          saveVolumes();
          return true;
        }

        if (mx >= 100 && mx <= 300 && my >= 310 && my <= 370) {
          if (mx >= 120 && mx <= 160) {
            playClickSound();
            currentTrack = (currentTrack - 1 + TRACKS.length) % TRACKS.length;
            playTrack(currentTrack);
            saveVolumes();
          } else if (mx >= 240 && mx <= 280) {
            playClickSound();
            currentTrack = (currentTrack + 1) % TRACKS.length;
            playTrack(currentTrack);
            saveVolumes();
          }
          return true;
        }

        if (mx >= 100 && mx <= 300 && my >= 410 && my <= 470) {
          playClickSound();
          pendingConfirm = 'resetSound';
          return true;
        }
      }

      if (settingsTab === 'data') {
        if (mx >= 100 && mx <= 300 && my >= RESET_RECORD_Y && my <= RESET_RECORD_Y + 60) {
          playClickSound();
          pendingConfirm = 'resetRecord';
          return true;
        }
      }

      return false;
    }

    function handleTap(mx, my) {
      startMusic();

      if (inSkins) {
        handleSkinsTap(mx, my);
        return;
      }

      if (inSettings) {
        handleSettingsTap(mx, my);
        return;
      }

      if (inMenu) {
        if (playerJumpTimer > 0) return;

        if (mx >= FS_BTN_X && mx <= FS_BTN_X + FS_BTN_SIZE &&
            my >= FS_BTN_Y && my <= FS_BTN_Y + FS_BTN_SIZE) {
          playClickSound();
          toggleFullscreen();
          return;
        }

        if (mx >= 70 && mx <= 330 && my >= 310 && my <= 380) {
          playClickSound();
          playerJumpTimer = 14;
          pendingAction = 'play';
        } else if (mx >= 70 && mx <= 330 && my >= 400 && my <= 470) {
          playClickSound();
          playerJumpTimer = 14;
          pendingAction = 'skins';
        } else if (mx >= 70 && mx <= 330 && my >= 490 && my <= 560) {
          playClickSound();
          settingsReturnScene = 'menu';
          inSettings = true;
          inMenu = false;
        }
        return;
      }

      if (gameOver) {
        if (mx >= 100 && mx <= 300 && my >= 400 && my <= 460) {
          playClickSound();
          canvas.style.filter = 'none';
          resetGame();
        } else if (mx >= 100 && mx <= 300 && my >= 470 && my <= 530) {
          playClickSound();
          fadingOut = true;
          fadeAlpha = 0;
          pendingScene = 'menu';
        }
        return;
      }

      if (paused) {
        if (mx >= 100 && mx <= 300 && my >= 280 && my <= 340) {
          playClickSound();
          paused = false;
          pauseAnimTime = 0;
          canvas.style.filter = 'none';
          music.volume = musicVolume;
        } else if (mx >= 100 && mx <= 300 && my >= 360 && my <= 420) {
          playClickSound();
          music.volume = musicVolume;
          canvas.style.filter = 'none';
          resetGame();
        } else if (mx >= 100 && mx <= 300 && my >= 440 && my <= 500) {
          playClickSound();
          music.volume = musicVolume;
          canvas.style.filter = 'none';
          fadingOut = true;
          fadeAlpha = 0;
          pendingScene = 'menu';
        }
        return;
      }

      const btnX = 175;
      const btnY = 0;

      if (mx >= btnX && mx <= btnX + BTN_SIZE &&
          my >= btnY && my <= btnY + BTN_SIZE) {
        playClickSound();
        paused = true;
        pauseAnimTime = 0;
        canvas.style.filter = 'blur(6px) brightness(0.6)';
        music.volume = musicVolume * 0.33;
        return;
      }

      const musicBtnX = 235;
      const musicBtnY = 0;

      if (mx >= musicBtnX && mx <= musicBtnX + BTN_SIZE &&
          my >= musicBtnY && my <= musicBtnY + BTN_SIZE) {
        playClickSound();
        musicOn = !musicOn;
        if (musicOn) {
          music.volume = paused ? musicVolume * 0.33 : musicVolume;
          music.play().catch(() => {});
        } else {
          music.pause();
        }
        return;
      }

      const settingsBtnX = 300;
      const settingsBtnY = 0;

      if (mx >= settingsBtnX && mx <= settingsBtnX + BTN_SIZE &&
          my >= settingsBtnY && my <= settingsBtnY + BTN_SIZE) {
        playClickSound();
        paused = true;
        pauseAnimTime = 0;
        canvas.style.filter = 'blur(6px) brightness(0.6)';
        music.volume = musicVolume * 0.33;
        settingsReturnScene = 'game';
        inSettings = true;
      }
    }

    container.addEventListener('pointerdown', (e) => {
      if (e.pointerType === 'touch') return;
      const c = getCanvasCoords(e.clientX, e.clientY);
      
      if (inSkins && pendingConfirm === null) {
        isDraggingScroll = true;
        dragStartY = c.my;
        scrollStartY = skinScrollY;
      }
      
      handleTap(c.mx, c.my);
    });

    container.addEventListener('mousemove', (e) => {
      const c = getCanvasCoords(e.clientX, e.clientY);
      mouseX = c.mx;
      mouseY = c.my;

      if (isDraggingScroll) {
        const dy = c.my - dragStartY;
        skinScrollY = scrollStartY + dy;
        
        const rows = Math.ceil(SKINS.length / 3);
        const totalHeight = rows * SKIN_CARD_H + (rows - 1) * SKIN_CARD_GAP;
        const maxScroll = 0;
        const minScroll = Math.min(0, 380 - totalHeight);

        if (skinScrollY > maxScroll) skinScrollY = maxScroll;
        if (skinScrollY < minScroll) skinScrollY = minScroll;
      }

      if (pendingConfirm === null && !isDraggingScroll) {
        if (draggingSlider === 'music') {
          musicVolume = pointToSliderValue(mouseX);
          music.volume = musicVolume;
          saveVolumes();
        } else if (draggingSlider === 'sound') {
          soundVolume = pointToSliderValue(mouseX);
          saveVolumes();
        }
      }
    });

    document.addEventListener('mouseup', () => {
      draggingSlider = null;
      isDraggingScroll = false;
      touchLeft = false;
      touchRight = false;
    });

    container.addEventListener('touchstart', (e) => {
      e.preventDefault();

      const rect = canvas.getBoundingClientRect();
      const touch = e.touches[0];
      if (!touch) return;

      const mx = (touch.clientX - rect.left) / rect.width * canvas.width;
      const my = (touch.clientY - rect.top) / rect.height * canvas.height;

      touchStartX = mx;
      touchStartY = my;

      if (inSkins && pendingConfirm === null) {
        dragStartY = my;
        scrollStartY = skinScrollY;
        isDraggingScroll = false;
      }

      if (inSettings && settingsTab === 'sound' && pendingConfirm === null) {
        if (isOnSlider(mx, my, MUSIC_SLIDER_Y)) {
          draggingSlider = 'music';
          musicVolume = pointToSliderValue(mx);
          music.volume = musicVolume;
          saveVolumes();
          return;
        }
        if (isOnSlider(mx, my, SOUND_SLIDER_Y)) {
          draggingSlider = 'sound';
          soundVolume = pointToSliderValue(mx);
          saveVolumes();
          return;
        }
      }

      if (!inMenu && !inSettings && !inSkins && !paused && !gameOver) {
        if (mx >= 15 && mx <= 115 && my >= 485 && my <= 585) {
          touchLeft = true;
          return;
        }
        if (mx >= 285 && mx <= 385 && my >= 485 && my <= 585) {
          touchRight = true;
          return;
        }
      }
    }, { passive: false });

    container.addEventListener('touchmove', (e) => {
      const rect = canvas.getBoundingClientRect();
      const touch = e.touches[0];
      if (!touch) return;
      
      const mx = (touch.clientX - rect.left) / rect.width * canvas.width;
      const my = (touch.clientY - rect.top) / rect.height * canvas.height;

      if (inSkins && pendingConfirm === null) {
        const dy = my - touchStartY;
        if (Math.abs(dy) > 15) {
          isDraggingScroll = true;
        }

        if (isDraggingScroll) {
          e.preventDefault();
          skinScrollY = scrollStartY + dy;
          
          const rows = Math.ceil(SKINS.length / 3);
          const totalHeight = rows * SKIN_CARD_H + (rows - 1) * SKIN_CARD_GAP;
          const maxScroll = 0;
          const minScroll = Math.min(0, 380 - totalHeight);

          if (skinScrollY > maxScroll) skinScrollY = maxScroll;
          if (skinScrollY < minScroll) skinScrollY = minScroll;
        }
        return;
      }

      if (!draggingSlider || pendingConfirm !== null) return;
      e.preventDefault();

      if (draggingSlider === 'music') {
        musicVolume = pointToSliderValue(mx);
        music.volume = musicVolume;
        saveVolumes();
      } else if (draggingSlider === 'sound') {
        soundVolume = pointToSliderValue(mx);
        saveVolumes();
      }
    }, { passive: false });

    container.addEventListener('touchend', (e) => {
      if (!isDraggingScroll && draggingSlider === null) {
        handleTap(touchStartX, touchStartY);
      }

      draggingSlider = null;
      isDraggingScroll = false;
      touchLeft = false;
      touchRight = false;
    });

    container.addEventListener('touchcancel', () => {
      draggingSlider = null;
      isDraggingScroll = false;
      touchLeft = false;
      touchRight = false;
    });

    let lastTime = 0;

    function roundedRect(c, x, y, w, h, r) {
      if (w < r * 2) r = w / 2;
      c.beginPath();
      c.moveTo(x + r, y);
      c.lineTo(x + w - r, y);
      c.arcTo(x + w, y, x + w, y + r, r);
      c.lineTo(x + w, y + h - r);
      c.arcTo(x + w, y + h, x + w - r, y + h, r);
      c.lineTo(x + r, y + h);
      c.arcTo(x, y + h, x, y + h - r, r);
      c.lineTo(x, y + r);
      c.arcTo(x, y, x + r, y, r);
      c.closePath();
    }

    function drawSlider(x, y, value, label) {
      ctx.fillStyle = 'white';
      ctx.font = 'bold 18px sans-serif';
      ctx.textAlign = 'left';
      ctx.fillText(label, SLIDER_X, y - 20);

      ctx.textAlign = 'right';
      ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
      ctx.font = '16px sans-serif';
      ctx.fillText(Math.round(value * 100) + '%', SLIDER_X + SLIDER_W, y - 20);

      ctx.fillStyle = 'rgba(0, 0, 0, 0.35)';
      roundedRect(ctx, SLIDER_X, y - SLIDER_H / 2, SLIDER_W, SLIDER_H, SLIDER_H / 2);
      ctx.fill();

      ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
      roundedRect(ctx, SLIDER_X, y - SLIDER_H / 2, SLIDER_W * value, SLIDER_H, SLIDER_H / 2);
      ctx.fill();

      const knobX = SLIDER_X + SLIDER_W * value;
      ctx.beginPath();
      ctx.arc(knobX, y, 14, 0, Math.PI * 2);
      ctx.fillStyle = 'white';
      ctx.fill();
      ctx.lineWidth = 3;
      ctx.strokeStyle = 'rgba(0, 0, 0, 0.3)';
      ctx.stroke();

      ctx.textAlign = 'left';
    }

    function drawSettingsButton(c, x, y, w, h, text, hover) {
      if (hover) {
        c.drawImage(menuBtnHoverImg, x, y, w, h);
      } else {
        c.drawImage(menuBtnImg, x, y, w, h);
      }
      c.fillStyle = 'white';
      c.font = 'bold 22px sans-serif';
      c.textAlign = 'center';
      c.fillText(text, x + w / 2, y + h / 2 + 8);
      c.textAlign = 'left';
    }

    function drawTab(x, y, w, h, text, active, hovered) {
      if (active || hovered) {
        ctx.drawImage(menuBtnHoverImg, x, y, w, h);
      } else {
        ctx.drawImage(menuBtnImg, x, y, w, h);
      }

      ctx.fillStyle = 'white';
      ctx.font = 'bold 20px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(text, x + w / 2, y + h / 2 + 7);
      ctx.textAlign = 'left';
    }

    function renderConfirmDialog() {
      ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
      ctx.fillRect(0, 0, 400, 600);

      ctx.fillStyle = 'rgba(40, 40, 60, 0.95)';
      roundedRect(ctx, CONFIRM_X, CONFIRM_Y, CONFIRM_W, CONFIRM_H, 16);
      ctx.fill();
      ctx.lineWidth = 2;
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
      ctx.stroke();

      ctx.fillStyle = 'white';
      ctx.font = 'bold 20px sans-serif';
      ctx.textAlign = 'center';

      const lines = getConfirmText().split('\n');
      let ty = CONFIRM_Y + 60;
      for (const line of lines) {
        ctx.fillText(line, 200, ty);
        ty += 30;
      }

      const hoverYes = isOverConfirmYes(mouseX, mouseY);
      if (hoverYes) {
        ctx.drawImage(menuBtnHoverImg, CONFIRM_YES_X, CONFIRM_BTN_Y, CONFIRM_BTN_W, CONFIRM_BTN_H);
      } else {
        ctx.drawImage(menuBtnImg, CONFIRM_YES_X, CONFIRM_BTN_Y, CONFIRM_BTN_W, CONFIRM_BTN_H);
      }
      ctx.fillStyle = 'white';
      ctx.font = 'bold 22px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('YES', CONFIRM_YES_X + CONFIRM_BTN_W / 2, CONFIRM_BTN_Y + CONFIRM_BTN_H / 2 + 8);

      const hoverNo = isOverConfirmNo(mouseX, mouseY);
      if (hoverNo) {
        ctx.drawImage(menuBtnHoverImg, CONFIRM_NO_X, CONFIRM_BTN_Y, CONFIRM_BTN_W, CONFIRM_BTN_H);
      } else {
        ctx.drawImage(menuBtnImg, CONFIRM_NO_X, CONFIRM_BTN_Y, CONFIRM_BTN_W, CONFIRM_BTN_H);
      }
      ctx.fillStyle = 'white';
      ctx.fillText('NO', CONFIRM_NO_X + CONFIRM_BTN_W / 2, CONFIRM_BTN_Y + CONFIRM_BTN_H / 2 + 8);

      ctx.textAlign = 'left';
    }

    function drawCoinAt(px, py, bobPhase, timeSeconds) {
      const bobOffset = Math.sin(timeSeconds * 2.5 + bobPhase) * 2;
      const frameIndex = Math.floor(coinAnimTimer) % 6;
      ctx.drawImage(coinFrames[frameIndex], px, py + bobOffset, 30, 30);
    }

    function renderSkins() {
      canvas.style.filter = 'none';
      uiCtx.clearRect(0, 0, 400, 600);

      drawMenuBackground(ctx);
      drawClouds(ctx);

      ctx.save();
      ctx.beginPath();
      ctx.rect(0, 120, 400, 380);
      ctx.clip();

      for (let i = 0; i < SKINS.length; i++) {
        const skin = SKINS[i];
        const card = getSkinCardRect(i);
        const owned = ownedSkins.includes(skin.id);
        const selected = selectedSkin === skin.id;

        if (card.y + card.h < 100 || card.y > 510) continue;

        ctx.fillStyle = 'rgba(0, 0, 0, 0.35)';
        roundedRect(ctx, card.x, card.y, card.w, card.h, 14);
        ctx.fill();

        if (selected) {
          ctx.lineWidth = 4;
          ctx.strokeStyle = '#FFD700';
          roundedRect(ctx, card.x, card.y, card.w, card.h, 14);
          ctx.stroke();
        }

        ctx.drawImage(skin.img, 0, 0, 50, 50, card.x + card.w / 2 - 30, card.y + 20, 60, 60);

        ctx.fillStyle = 'white';
        ctx.font = 'bold 18px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(skin.name, card.x + card.w / 2, card.y + 105);

        if (owned) {
          if (selected) {
            ctx.fillStyle = '#FFD700';
            ctx.font = 'bold 16px sans-serif';
            ctx.fillText('SELECTED', card.x + card.w / 2, card.y + 135);
          } else {
            ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
            ctx.font = '14px sans-serif';
            ctx.fillText('OWNED', card.x + card.w / 2, card.y + 135);
          }
        } else {
          ctx.fillStyle = coinsTotal >= skin.price ? '#FFD700' : 'rgba(255, 100, 100, 0.9)';
          ctx.font = 'bold 16px sans-serif';
          ctx.fillText(skin.price + ' coins', card.x + card.w / 2, card.y + 135);
        }
      }
      ctx.restore();

      ctx.fillStyle = 'white';
      ctx.font = 'bold 32px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('SKINS', 200, 70);

      ctx.drawImage(coinPanelImg, 130, 90, 140, 40);
      ctx.drawImage(coinImg, 145, 95, 30, 30);
      ctx.fillStyle = 'white';
      ctx.font = 'bold 22px sans-serif';
      ctx.textAlign = 'left';
      ctx.fillText(coinsTotal, 185, 123);

      ctx.textAlign = 'left';

      const hoverBack = (mouseX >= 100 && mouseX <= 300 &&
                         mouseY >= 510 && mouseY <= 570);
      drawSettingsButton(ctx, 100, 510, 200, 60, 'BACK', hoverBack);

      if (soonShown && pendingConfirm === null) {
        soonTimer = soonTimer - 1;
        if (soonTimer <= 0) soonShown = false;

        ctx.filter = 'blur(8px)';
        ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
        ctx.fillRect(80, 260, 240, 80);
        ctx.filter = 'none';

        ctx.fillStyle = 'white';
        ctx.font = 'bold 22px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('NOT ENOUGH COINS', 200, 308);
        ctx.textAlign = 'left';
      }

      if (pendingConfirm !== null) {
        renderConfirmDialog();
      }
    }

    function renderSettings() {
      canvas.style.filter = 'none';
      uiCtx.clearRect(0, 0, 400, 600);

      drawMenuBackground(ctx);
      drawClouds(ctx);

      const hoverSoundTab = (mouseX >= TAB_SOUND_X && mouseX <= TAB_SOUND_X + TAB_W &&
                             mouseY >= TAB_Y && mouseY <= TAB_Y + TAB_H);
      const hoverDataTab = (mouseX >= TAB_DATA_X && mouseX <= TAB_DATA_X + TAB_W &&
                            mouseY >= TAB_Y && mouseY <= TAB_Y + TAB_H);
      const hoverAboutTab = (mouseX >= TAB_ABOUT_X && mouseX <= TAB_ABOUT_X + TAB_W &&
                             mouseY >= TAB_Y && mouseY <= TAB_Y + TAB_H);

      drawTab(TAB_SOUND_X, TAB_Y, TAB_W, TAB_H, 'SOUND', settingsTab === 'sound', hoverSoundTab);
      drawTab(TAB_DATA_X, TAB_Y, TAB_W, TAB_H, 'DATA', settingsTab === 'data', hoverDataTab);
      drawTab(TAB_ABOUT_X, TAB_Y, TAB_W, TAB_H, 'ABOUT', settingsTab === 'about', hoverAboutTab);

      if (settingsTab === 'sound') {
        drawSlider(SLIDER_X, MUSIC_SLIDER_Y, musicVolume, 'MUSIC');
        drawSlider(SLIDER_X, SOUND_SLIDER_Y, soundVolume, 'SOUNDS');

        const hoverTrack = (mouseX >= 100 && mouseX <= 300 && mouseY >= 310 && mouseY <= 370);
        if (hoverTrack) {
          ctx.drawImage(menuBtnHoverImg, 100, 310, 200, 60);
        } else {
          ctx.drawImage(menuBtnImg, 100, 310, 200, 60);
        }
        
        ctx.fillStyle = 'white';
        ctx.font = 'bold 18px sans-serif';
        ctx.textAlign = 'center';
        
        const trackText = 'Music Track ' + (currentTrack + 1);
        ctx.fillText(trackText, 200, 345);
        
        ctx.font = 'bold 24px sans-serif';
        ctx.textAlign = 'left';
        ctx.fillText('<-', 115, 347);
        
        ctx.textAlign = 'right';
        ctx.fillText('->', 285, 347);
        ctx.textAlign = 'left';

        const hoverReset = (mouseX >= 100 && mouseX <= 300 &&
                            mouseY >= 410 && mouseY <= 470);
        drawSettingsButton(ctx, 100, 410, 200, 60, 'RESET', hoverReset);
      }

      if (settingsTab === 'data') {
        ctx.fillStyle = 'white';
        ctx.font = 'bold 20px sans-serif';

        const stats = [
          { label: 'Best Score', value: String(highScore) },
          { label: 'Games Played', value: String(gamesPlayed) },
          { label: 'Jumps Total', value: String(jumpsTotal) },
          { label: 'Coins Total', value: String(coinsTotal) },
          { label: 'First Play', value: formatDate(firstPlayDate) }
        ];

        let sy = 115;
        for (const s of stats) {
          ctx.fillStyle = 'rgba(255, 255, 255, 0.75)';
          ctx.font = '16px sans-serif';
          ctx.textAlign = 'left';
          ctx.fillText(s.label, 30, sy);

          ctx.fillStyle = 'white';
          ctx.font = 'bold 22px sans-serif';
          ctx.textAlign = 'right';
          ctx.fillText(s.value, 370, sy);

          sy += 42;
        }

        ctx.textAlign = 'left';

        const hoverResetRec = (mouseX >= 100 && mouseX <= 300 &&
                               mouseY >= RESET_RECORD_Y && mouseY <= RESET_RECORD_Y + 60);
        drawSettingsButton(ctx, 100, RESET_RECORD_Y, 200, 60, 'RESET RECORD', hoverResetRec);
      }

      if (settingsTab === 'about') {
        ctx.drawImage(titleImg, 40, 110, 320, 100);

        ctx.fillStyle = 'white';
        ctx.textAlign = 'center';

        ctx.font = 'bold 22px sans-serif';
        ctx.fillText('v0.1 alpha', 200, 260);

        ctx.font = '18px sans-serif';
        ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
        ctx.fillText('Author: [:)]', 200, 305);
        ctx.fillText('HTML5 + JavaScript', 200, 340);

        ctx.font = '14px sans-serif';
        ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
        ctx.fillText('© 2026', 200, 400);

        ctx.textAlign = 'left';
      }

      const hoverBack = (mouseX >= 100 && mouseX <= 300 &&
                         mouseY >= 510 && mouseY <= 570);
      drawSettingsButton(ctx, 100, 510, 200, 60, 'BACK', hoverBack);

      if (soonShown && pendingConfirm === null) {
        soonTimer = soonTimer - 1;
        if (soonTimer <= 0) soonShown = false;

        ctx.filter = 'blur(8px)';
        ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
        ctx.fillRect(100, 260, 200, 80);
        ctx.filter = 'none';

        ctx.fillStyle = 'white';
        ctx.font = 'bold 28px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('SOON...', 200, 308);
        ctx.textAlign = 'left';
      }

      if (pendingConfirm !== null) {
        renderConfirmDialog();
      }
    }

    createStars();
    createClouds();

    function loop(timestamp) {
      if (!timestamp) timestamp = 0;
      let delta = (timestamp - lastTime) / 1000;
      if (delta > 0.1) delta = 0.1;
      lastTime = timestamp;

      const timeSeconds = timestamp / 1000;

      coinAnimTimer += delta * 10;

      updateClouds(delta);

      if (inSkins) {
        renderSkins();
        requestAnimationFrame(loop);
        return;
      }

      if (inSettings) {
        renderSettings();
        requestAnimationFrame(loop);
        return;
      }

      if (inMenu) {
        canvas.style.filter = 'none';
        uiCtx.clearRect(0, 0, 400, 600);

        if (fadingIn) {
          fadeAlpha = fadeAlpha - 0.05;
          if (fadeAlpha <= 0) {
            fadeAlpha = 0;
            fadingIn = false;
          }
        }

        drawMenuBackground(ctx);
        drawClouds(ctx);

        ctx.drawImage(titleImg, 20, 30, 360, 110);

        if (playerJumpTimer > 0) {
          playerJumpTimer = playerJumpTimer - 1;
          const t = playerJumpTimer / 14;
          playerJumpOffset = -20 * Math.sin(t * Math.PI);
        } else {
          playerJumpOffset = 0;
        }

        const curImg = getCurrentPlayerImage();

        if (isLemonnSelected()) {
          ctx.drawImage(curImg, 0, 0, 50, 50, 165, 180 + playerJumpOffset, 70, 70);
        } else if (playerJumpTimer > 7) {
          ctx.drawImage(curImg, 0, 50, 50, 50, 165, 180 + playerJumpOffset, 70, 70);
        } else {
          ctx.drawImage(curImg, 0, 0, 50, 50, 165, 180 + playerJumpOffset, 70, 70);
        }

        const hoverPlay = (mouseX >= 70 && mouseX <= 330 &&
                           mouseY >= 310 && mouseY <= 380);
        const hoverSkins = (mouseX >= 70 && mouseX <= 330 &&
                            mouseY >= 400 && mouseY <= 470);
        const hoverSettings = (mouseX >= 70 && mouseX <= 330 &&
                               mouseY >= 490 && mouseY <= 560);

        if (hoverPlay) {
          ctx.drawImage(menuBtnHoverImg, 70, 310, 260, 70);
        } else {
          ctx.drawImage(menuBtnImg, 70, 310, 260, 70);
        }
        ctx.fillStyle = 'white';
        ctx.font = 'bold 28px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('PLAY', 200, 355);

        if (hoverSkins) {
          ctx.drawImage(menuBtnHoverImg, 70, 400, 260, 70);
        } else {
          ctx.drawImage(menuBtnImg, 70, 400, 260, 70);
        }
        ctx.fillText('SKINS', 200, 445);

        if (hoverSettings) {
          ctx.drawImage(menuBtnHoverImg, 70, 490, 260, 70);
        } else {
          ctx.drawImage(menuBtnImg, 70, 490, 260, 70);
        }
        ctx.fillText('SETTINGS', 200, 535);

        ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
        ctx.font = '14px sans-serif';
        ctx.textAlign = 'left';
        ctx.fillText('v0.1 alpha', 10, 585);

        const hoverFS = (mouseX >= FS_BTN_X && mouseX <= FS_BTN_X + FS_BTN_SIZE &&
                         mouseY >= FS_BTN_Y && mouseY <= FS_BTN_Y + FS_BTN_SIZE);
        ctx.fillStyle = hoverFS ? 'rgba(255, 255, 255, 0.8)' : 'rgba(255, 255, 255, 0.4)';
        ctx.fillRect(FS_BTN_X, FS_BTN_Y, FS_BTN_SIZE, FS_BTN_SIZE);
        
        ctx.fillStyle = hoverFS ? '#222' : 'white';
        ctx.font = 'bold 24px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('⛶', FS_BTN_X + FS_BTN_SIZE / 2, FS_BTN_Y + FS_BTN_SIZE / 2 + 8);
        ctx.textAlign = 'left';

        if (playerJumpTimer === 0 && pendingAction !== null) {
          if (pendingAction === 'play') {
            fadingOut = true;
            fadeAlpha = 0;
            pendingScene = 'game';
            pendingAction = null;
          } else if (pendingAction === 'skins') {
            inSkins = true;
            inMenu = false;
            pendingAction = null;
          }
        }

        if (fadingOut) {
          fadeAlpha = fadeAlpha + 0.05;
          if (fadeAlpha >= 1) {
            fadeAlpha = 1;
            fadingOut = false;

            if (pendingScene === 'game') {
              inMenu = false;
              resetGame();
              fadingIn = true;
            }
            pendingScene = null;
          }
        }

        ctx.textAlign = 'left';

        if (fadeAlpha > 0) {
          ctx.fillStyle = 'rgba(0, 0, 0, ' + fadeAlpha + ')';
          ctx.fillRect(0, 0, 400, 600);
        }

        requestAnimationFrame(loop);
        return;
      }

      if (paused) {
        pauseAnimTime += delta;
        uiCtx.clearRect(0, 0, 400, 600);

        const titleBob = Math.sin(pauseAnimTime * 3) * 4;

        uiCtx.fillStyle = 'white';
        uiCtx.font = '48px sans-serif';
        uiCtx.textAlign = 'center';
        uiCtx.fillText('PAUSED', 200, 180 + titleBob);

        const buttonDefs = [
          { y: 280, h: 60, delay: 0.05 },
          { y: 360, h: 60, delay: 0.15 },
          { y: 440, h: 60, delay: 0.25 }
        ];

        const hoverContinue = (mouseX >= 100 && mouseX <= 300 &&
                               mouseY >= 280 && mouseY <= 340);
        const hoverRestart = (mouseX >= 100 && mouseX <= 300 &&
                              mouseY >= 360 && mouseY <= 420);
        const hoverMenu = (mouseX >= 100 && mouseX <= 300 &&
                           mouseY >= 440 && mouseY <= 500);

        const progresses = buttonDefs.map(b => {
          let p = (pauseAnimTime - b.delay) / 0.35;
          if (p < 0) p = 0;
          if (p > 1) p = 1;
          return p;
        });

        for (let i = 0; i < 3; i++) {
          const b = buttonDefs[i];
          const p = progresses[i];
          const yOffset = (1 - p) * 30;
          uiCtx.globalAlpha = p;

          if (i === 0) {
            if (hoverContinue) {
              uiCtx.drawImage(btnContinueHoverImg, 100, b.y + yOffset, 200, b.h);
            } else {
              uiCtx.drawImage(btnContinueImg, 100, b.y + yOffset, 200, b.h);
            }
          } else if (i === 1) {
            if (hoverRestart) {
              uiCtx.drawImage(btnRestartHoverImg, 100, b.y + yOffset, 200, b.h);
            } else {
              uiCtx.drawImage(btnRestartImg, 100, b.y + yOffset, 200, b.h);
            }
          } else {
            if (hoverMenu) {
              uiCtx.drawImage(menuBtnHoverImg, 100, b.y + yOffset, 200, b.h);
            } else {
              uiCtx.drawImage(menuBtnImg, 100, b.y + yOffset, 200, b.h);
            }
          }

          uiCtx.fillStyle = 'white';
          uiCtx.font = 'bold 24px sans-serif';
          uiCtx.textAlign = 'center';
          if (i === 0) uiCtx.fillText('CONTINUE', 200, b.y + yOffset + 38);
          if (i === 1) uiCtx.fillText('RESTART', 200, b.y + yOffset + 38);
          if (i === 2) uiCtx.fillText('MENU', 200, b.y + yOffset + 38);
          uiCtx.textAlign = 'left';
        }

        uiCtx.globalAlpha = 1;

        if (fadingOut) {
          fadeAlpha = fadeAlpha + 0.05;
          if (fadeAlpha >= 1) {
            fadeAlpha = 1;
            fadingOut = false;

            if (pendingScene === 'menu') {
              canvas.style.filter = 'none';
              uiCtx.clearRect(0, 0, 400, 600);
              inMenu = true;
              paused = false;
              pauseAnimTime = 0;
              fadingIn = true;
            }
            pendingScene = null;
          }
          if (fadeAlpha > 0) {
            uiCtx.fillStyle = 'rgba(0, 0, 0, ' + fadeAlpha + ')';
            uiCtx.fillRect(0, 0, 400, 600);
          }
        }

        if (fadingIn) {
          fadeAlpha = fadeAlpha - 0.05;
          if (fadeAlpha <= 0) {
            fadeAlpha = 0;
            fadingIn = false;
          }
          if (fadeAlpha > 0) {
            uiCtx.fillStyle = 'rgba(0, 0, 0, ' + fadeAlpha + ')';
            uiCtx.fillRect(0, 0, 400, 600);
          }
        }

        requestAnimationFrame(loop);
        return;
      } else {
        uiCtx.clearRect(0, 0, 400, 600);
      }

      if (gameOver) {
        gameOverTimer = gameOverTimer + 1;

        uiCtx.clearRect(0, 0, 400, 600);
        uiCtx.fillStyle = 'white';
        uiCtx.font = '42px sans-serif';
        uiCtx.textAlign = 'center';
        uiCtx.fillText('GAME OVER', 200, 130);

        if (gameOverTimer > 20) {
          uiCtx.font = '28px sans-serif';
          uiCtx.fillStyle = 'white';
          uiCtx.fillText('Score: ' + Math.floor(score), 200, 190);
        }

        if (gameOverTimer > 40) {
          if (isNewRecord) {
            uiCtx.font = 'bold 26px sans-serif';
            uiCtx.fillStyle = '#FFD700';
            uiCtx.fillText('⭐ NEW RECORD! ⭐', 200, 250);

            uiCtx.font = '24px sans-serif';
            uiCtx.fillStyle = 'white';
            uiCtx.fillText('Record: ' + highScore, 200, 290);
          } else {
            uiCtx.font = '24px sans-serif';
            uiCtx.fillStyle = 'white';
            uiCtx.fillText('Record: ' + highScore, 200, 250);
          }
        }

        const hoverRestartGameOver = (mouseX >= 100 && mouseX <= 300 &&
                                      mouseY >= 400 && mouseY <= 460);
        const hoverMenuGameOver = (mouseX >= 100 && mouseX <= 300 &&
                                   mouseY >= 470 && mouseY <= 530);

        if (hoverRestartGameOver) {
          uiCtx.drawImage(btnRestartHoverImg, 100, 400, 200, 60);
        } else {
          uiCtx.drawImage(btnRestartImg, 100, 400, 200, 60);
        }

        if (hoverMenuGameOver) {
          uiCtx.drawImage(menuBtnHoverImg, 100, 470, 200, 60);
        } else {
          uiCtx.drawImage(menuBtnImg, 100, 470, 200, 60);
        }

        uiCtx.fillStyle = 'white';
        uiCtx.font = 'bold 24px sans-serif';
        uiCtx.textAlign = 'center';
        uiCtx.fillText('RESTART', 200, 438);
        uiCtx.fillText('MENU', 200, 508);
        uiCtx.textAlign = 'left';

        if (fadingOut) {
          fadeAlpha = fadeAlpha + 0.05;
          if (fadeAlpha >= 1) {
            fadeAlpha = 1;
            fadingOut = false;

            if (pendingScene === 'menu') {
              canvas.style.filter = 'none';
              uiCtx.clearRect(0, 0, 400, 600);
              inMenu = true;
              gameOver = false;
              fadingIn = true;
            }
            pendingScene = null;
          }
          if (fadeAlpha > 0) {
            uiCtx.fillStyle = 'rgba(0, 0, 0, ' + fadeAlpha + ')';
            uiCtx.fillRect(0, 0, 400, 600);
          }
        }

        if (fadingIn) {
          fadeAlpha = fadeAlpha - 0.05;
          if (fadeAlpha <= 0) {
            fadeAlpha = 0;
            fadingIn = false;
          }
          if (fadeAlpha > 0) {
            uiCtx.fillStyle = 'rgba(0, 0, 0, ' + fadeAlpha + ')';
            uiCtx.fillRect(0, 0, 400, 600);
          }
        }

        requestAnimationFrame(loop);
        return;
      }

      if (landTimer > 0) landTimer = landTimer - 1;

      if (keys['ArrowLeft'] || touchLeft) x = x - 300 * delta;
      if (keys['ArrowRight'] || touchRight) x = x + 300 * delta;

      vy = vy + 1800 * delta;
      y = y + vy * delta;

      if (y < 300) {
        let shift = 300 - y;
        score = score + shift / 30;

        if (Math.floor(score) > highScore) {
          highScore = Math.floor(score);
          localStorage.setItem('highScore', highScore);
        }

        if (Math.floor(score) > startHighScore && !recordTextShown && startHighScore > 0) {
           floatingTexts.push({
             x: x + 25,
             y: y - 10,
             text: 'NEW RECORD!',
             color: '#FFD700',
             life: 2.0,
             vy: -40,
             size: 24
           });
           recordTextShown = true;
        }

        y = 300;
        for (let p of platforms) {
          p.y = p.y + shift;
        }
        platforms = platforms.filter(p => p.y < 650);

        let topY = 1000;
        for (let p of platforms) {
          if (p.y < topY) topY = p.y;
        }
        while (platforms.length < 8) {
          topY = topY - 80;
          let prevX = 150;
          if (platforms.length > 0) {
            prevX = platforms[platforms.length - 1].x;
          }
          const created = createPlatform(topY, prevX);
          for (const p of created) platforms.push(p);
        }
      }

      for (let p of platforms) {
        if (p.spawnProgress < 1) {
          p.spawnProgress = Math.min(1, p.spawnProgress + delta * 3);
        }
        if (p.isMoving) {
          p.x = p.x + p.vx * delta;
          if (p.x < 0) {
            p.x = 0;
            p.vx = Math.abs(p.vx);
          } else if (p.x > 290) {
            p.x = 290;
            p.vx = -Math.abs(p.vx);
          }
        }

        if (p.squash > 0) {
          p.squash = p.squash - delta * 10;
          if (p.squash < 0) p.squash = 0;
        }
      }

      for (let i = particles.length - 1; i >= 0; i--) {
        const pt = particles[i];
        pt.x += pt.vx * delta;
        pt.y += pt.vy * delta;
        pt.vy += 100 * delta;
        pt.life -= delta * 2.5;
        if (pt.life <= 0) {
          particles.splice(i, 1);
        }
      }

      for (let i = juiceParticles.length - 1; i >= 0; i--) {
        const jp = juiceParticles[i];
        jp.x += jp.vx * delta;
        jp.y += jp.vy * delta;
        jp.vy += 150 * delta;
        jp.life -= delta * 2;
        if (jp.life <= 0) {
          juiceParticles.splice(i, 1);
        }
      }

      for (let i = floatingTexts.length - 1; i >= 0; i--) {
        const ft = floatingTexts[i];
        ft.y += ft.vy * delta;
        ft.life -= delta;
        if (ft.life <= 0) {
          floatingTexts.splice(i, 1);
        }
      }

      targetPhase = startPhase + Math.floor(score / 500);

      if (currentPhase < targetPhase) {
        phaseTransition = phaseTransition + 0.3 * delta;
        if (phaseTransition > 1) {
          phaseTransition = 0;
          currentPhase = currentPhase + 1;
        }
      }

      if (!gameOver && vy > 0) {
        for (let p of platforms) {
          const playerBottom = y + 50;
          const prevBottom = playerBottom - vy * delta;
          const pW = p.width || PLATFORM_W;

          if (x + 50 > p.x && x < p.x + pW &&
              prevBottom <= p.y && playerBottom >= p.y &&
              p.y < 580) {

            if (p.spike) {
              playSpikeSound();
              triggerGameOver();
              break;
            }

            y = p.y - 50;
            p.squash = 1;

            for (let i = 0; i < 6; i++) {
              particles.push({
                x: x + 25 + (Math.random() - 0.5) * 20,
                y: y + 45 + (Math.random() - 0.5) * 10,
                vx: (Math.random() - 0.5) * 120,
                vy: (Math.random() - 0.5) * 120 - 30,
                size: 1.5 + Math.random() * 1.5,
                life: 1
              });
            }

            if (isLemonnSelected()) {
               lemonLandTime = timeSeconds;
               lemonJumpTime = timeSeconds;

               for (let i = 0; i < 8; i++) {
                 juiceParticles.push({
                   x: x + 25,
                   y: y + 25,
                   vx: (Math.random() - 0.5) * 200,
                   vy: (Math.random() - 0.5) * 200 - 50,
                   size: 1.5 + Math.random() * 2.5,
                   life: 1
                 });
               }
            }

            if (p.spring) {
              vy = -1080;
              playSpringSound();
            } else {
              vy = -600;
              playJumpSound();
            }
            landTimer = 10;

            if (p.isMoving) {
              x += p.vx * delta;
              if (x < 0) x = 0;
              if (x > 350) x = 350;
            }

            jumpsTotal = jumpsTotal + 1;
            saveStats();
          }
        }
      }

      if (!gameOver) {
        for (let p of platforms) {
          if (p.hasCoin && !p.collected) {
            const pW = p.width || PLATFORM_W;
            const coinX = p.x + pW / 2 - 15;
            const coinY = p.y - 20 - 30;
            if (x + 50 > coinX && x < coinX + 30 &&
                y + 50 > coinY && y < coinY + 30) {
              p.collected = true;
              coinsTotal = coinsTotal + 1;
              saveStats();
              playCoinSound();
              
              floatingTexts.push({
                x: coinX + 15,
                y: coinY,
                text: '+1',
                color: '#FFD700',
                life: 1.0,
                vy: -50,
                size: 20
              });
            }
          }
        }
      }

      if (y > 700 && !gameOver) {
        triggerGameOver();
      }

      const currentColors = getPhaseColors(currentPhase);
      const nextColors = getPhaseColors(currentPhase + 1);

      const baseGradient = ctx.createLinearGradient(0, 0, 0, 600);
      baseGradient.addColorStop(0, currentColors[0]);
      baseGradient.addColorStop(0.3, currentColors[1]);
      baseGradient.addColorStop(0.55, currentColors[2]);
      baseGradient.addColorStop(0.8, currentColors[3]);
      baseGradient.addColorStop(1, currentColors[4]);

      ctx.fillStyle = baseGradient;
      ctx.fillRect(0, 0, 400, 600);

      if (phaseTransition > 0) {
        const nextGradient = ctx.createLinearGradient(0, 0, 0, 600);
        nextGradient.addColorStop(0, nextColors[0]);
        nextGradient.addColorStop(0.3, nextColors[1]);
        nextGradient.addColorStop(0.55, nextColors[2]);
        nextGradient.addColorStop(0.8, nextColors[3]);
        nextGradient.addColorStop(1, nextColors[4]);

        ctx.globalAlpha = phaseTransition;
        ctx.fillStyle = nextGradient;
        ctx.fillRect(0, 0, 400, 600);
        ctx.globalAlpha = 1;
      }

      const currentPhaseMod = currentPhase % 4;
      const nextPhaseMod = (currentPhase + 1) % 4;

      nightAlpha = 0;
      if (currentPhaseMod === 2) nightAlpha = 1 - phaseTransition;
      if (nextPhaseMod === 2) nightAlpha = phaseTransition;

      if (rainCooldown > 0) rainCooldown = rainCooldown - 1;

      if (isRaining) {
        rainTimer = rainTimer - 1;
        if (rainTimer <= 0) {
          stopRain();

          const dayIsActive = (currentPhaseMod === 0 && phaseTransition < 0.5);

          if (dayIsActive && Math.random() < 0.3) {
            showRainbow = true;
            rainbowTimer = 1500;
            rainbowAlpha = 0;
          }
        }
      } else if (rainCooldown <= 0 && nightAlpha === 0) {
        if (Math.random() < 0.0002) {
          startRain();
        }
      }

      if (showRainbow) {
        rainbowTimer = rainbowTimer - 1;

        if (rainbowTimer > 1440) {
          rainbowAlpha = rainbowAlpha + 0.015;
          if (rainbowAlpha > 1) rainbowAlpha = 1;
        } else if (rainbowTimer < 60) {
          rainbowAlpha = rainbowAlpha - 0.02;
          if (rainbowAlpha < 0) rainbowAlpha = 0;
        }

        if (rainbowTimer <= 0) {
          showRainbow = false;
          rainbowAlpha = 0;
        }
      }

      if (eventActive) {
        eventX = eventX + eventVX;
        eventY = eventY + eventVY;

        if (eventY > 700 || eventX < -150 || eventX > 500) {
          eventActive = false;
        }
      }

      drawClouds(ctx);

      if (nightAlpha > 0) {
        for (let s of stars) {
          const flicker = 0.6 + Math.sin(Date.now() * 0.003 + s.flickerOffset) * 0.4;
          const starAlpha = s.alpha * nightAlpha * flicker;

          ctx.beginPath();
          ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(255, 255, 255, ' + starAlpha + ')';
          ctx.fill();
        }
      }

      if (nightAlpha > 0 && Math.random() < 0.005) {
        spawnShootingStar();
      }

      for (let i = shootingStars.length - 1; i >= 0; i--) {
        const ss = shootingStars[i];

        ss.x = ss.x + ss.vx;
        ss.y = ss.y + ss.vy;
        ss.life = ss.life - 0.01;

        if (ss.life <= 0 || ss.y > 650) {
          shootingStars.splice(i, 1);
          continue;
        }

        const tailX = ss.x - ss.vx * (ss.length / 10);
        const tailY = ss.y - ss.vy * (ss.length / 10);

        const shootGradient = ctx.createLinearGradient(ss.x, ss.y, tailX, tailY);
        shootGradient.addColorStop(0, 'rgba(255, 255, 255, ' + (nightAlpha * ss.life) + ')');
        shootGradient.addColorStop(1, 'rgba(255, 255, 255, 0)');

        ctx.strokeStyle = shootGradient;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(ss.x, ss.y);
        ctx.lineTo(tailX, tailY);
        ctx.stroke();
      }

      if (isRaining) {
        ctx.lineWidth = 1.5;

        for (let drop of rainDrops) {
          drop.y = drop.y + drop.speed;

          if (drop.y > 650) {
            drop.y = -20;
            drop.x = Math.random() * 450 - 50;
          }

          ctx.beginPath();
          ctx.moveTo(drop.x, drop.y);
          ctx.lineTo(drop.x - 2, drop.y + drop.length);

          if (nightAlpha > 0.5) {
            ctx.strokeStyle = 'rgba(220, 230, 255, ' + drop.alpha + ')';
          } else {
            ctx.strokeStyle = 'rgba(80, 110, 160, ' + (drop.alpha + 0.2) + ')';
          }
          ctx.stroke();
        }
      }

      const dayAlpha = (currentPhaseMod === 0) ? (1 - phaseTransition) : 0;

      if (dayAlpha > 0) {
        const sunX = 200;
        const sunY = 80;
        const sunSize = 50;

        const glow = ctx.createRadialGradient(sunX, sunY, 0, sunX, sunY, sunSize * 1.5);
        glow.addColorStop(0, 'rgba(255, 240, 150, ' + (0.6 * dayAlpha) + ')');
        glow.addColorStop(0.5, 'rgba(255, 240, 150, ' + (0.3 * dayAlpha) + ')');
        glow.addColorStop(1, 'rgba(255, 240, 150, 0)');

        ctx.fillStyle = glow;
        ctx.beginPath();
        ctx.arc(sunX, sunY, sunSize * 1.5, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = 'rgba(255, 245, 180, ' + dayAlpha + ')';
        ctx.beginPath();
        ctx.arc(sunX, sunY, sunSize / 2, 0, Math.PI * 2);
        ctx.fill();
      }

      if (eventActive) {
        ctx.globalAlpha = 0.35;
        ctx.drawImage(eventImg, eventX, eventY, eventSize, eventSize);
        ctx.globalAlpha = 1;
      }

      if (showRainbow && rainbowAlpha > 0) {
        const rainbowColors = [
          '#ff0000', '#ff7f00', '#ffff00', '#00ff00',
          '#0000ff', '#4b0082', '#9400d3'
        ];

        const cx = 200;
        const cy = 600;
        const baseRadius = 280;
        const ringWidth = 8;

        ctx.filter = 'blur(6px)';
        ctx.lineWidth = ringWidth;
        ctx.lineCap = 'round';

        for (let i = 0; i < rainbowColors.length; i++) {
          const radius = baseRadius - i * ringWidth;
          ctx.globalAlpha = rainbowAlpha * 0.25;
          ctx.strokeStyle = rainbowColors[i];
          ctx.beginPath();
          ctx.arc(cx, cy, radius, Math.PI, Math.PI * 2);
          ctx.stroke();
        }

        ctx.filter = 'none';
        ctx.globalAlpha = 1;
        ctx.lineCap = 'butt';
      }

      for (let p of platforms) {
        const pW = p.width || PLATFORM_W;
        const squashOffset = p.squash * 5;
        const drawHeight = 20 - squashOffset;
        const riseOffset = (1 - p.spawnProgress) * 10;
        const drawY = p.y + squashOffset + riseOffset;

        ctx.globalAlpha = p.spawnProgress;

        if (p.spike) {
          ctx.drawImage(spikeImg, p.x, drawY, pW, 20);
        } else if (p.spring) {
          ctx.drawImage(springImg, p.x, drawY, pW, 20);
        } else {
          ctx.drawImage(platformImg, p.x, drawY, pW, drawHeight);
        }

        if (p.hasCoin && !p.collected) {
          const coinX = p.x + pW / 2 - 15;
          const coinY = p.y - 20 - 30;
          drawCoinAt(coinX, coinY, p.bobPhase, timeSeconds);
        }
      }
      ctx.globalAlpha = 1;

      for (let pt of particles) {
        ctx.globalAlpha = pt.life;
        ctx.fillStyle = 'white';
        ctx.beginPath();
        ctx.arc(pt.x, pt.y, pt.size, 0, Math.PI * 2);
        ctx.fill();
      }
      
      for (let jp of juiceParticles) {
        ctx.globalAlpha = jp.life;
        ctx.fillStyle = '#FFEB3B';
        ctx.beginPath();
        ctx.arc(jp.x, jp.y, jp.size, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;

      const curImg = getCurrentPlayerImage();

      if (isLemonnSelected()) {
         const LEMON_FRAMES = [
            { col: 0, row: 0 },
            { col: 1, row: 0 },
            { col: 0, row: 1 },
            { col: 1, row: 1 }
         ];

         let lemonFrameIndex = 0;

         const timeSinceLand = timeSeconds - lemonLandTime;
         const timeSinceJump = timeSeconds - lemonJumpTime;

         if (vy > 0) {
            lemonFrameIndex = 0;
         } else {
            const JUMP_ANIM_DURATION = 0.25;
            if (timeSinceJump >= 0 && timeSinceJump < JUMP_ANIM_DURATION) {
               const t = timeSinceJump / JUMP_ANIM_DURATION;
               if (t < 0.33) {
                  lemonFrameIndex = 3;
               } else if (t < 0.66) {
                  lemonFrameIndex = 2;
               } else if (t < 0.9) {
                  lemonFrameIndex = 1;
               } else {
                  lemonFrameIndex = 0;
               }
            } else {
               lemonFrameIndex = 0;
            }
         }

         const LAND_ANIM_DURATION = 0.15;
         if (timeSinceLand >= 0 && timeSinceLand < LAND_ANIM_DURATION) {
            const t = timeSinceLand / LAND_ANIM_DURATION;
            if (t < 0.33) {
               lemonFrameIndex = 1;
            } else if (t < 0.66) {
               lemonFrameIndex = 2;
            } else {
               lemonFrameIndex = 3;
            }
         }

         const f = LEMON_FRAMES[lemonFrameIndex];
         ctx.drawImage(
            curImg,
            f.col * 50, f.row * 50, 50, 50,
            x, y, 50, 50
         );
      } else {
         if (landTimer > 0) {
           ctx.drawImage(curImg, 0, 50, 50, 50, x, y, 50, 50);
         } else {
           ctx.drawImage(curImg, 0, 0, 50, 50, x, y, 50, 50);
         }
      }

      for (let ft of floatingTexts) {
        ctx.globalAlpha = Math.min(1, ft.life);
        ctx.fillStyle = ft.color;
        ctx.font = 'bold ' + ft.size + 'px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(ft.text, ft.x, ft.y);
      }
      ctx.globalAlpha = 1;
      ctx.textAlign = 'left';

      ctx.drawImage(scorePanelImg, 0, 0, 170, 80);

      ctx.fillStyle = 'white';
      ctx.font = '24px sans-serif';
      ctx.fillText('Score: ' + Math.floor(score), 10, 30);

      ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
      ctx.font = '18px sans-serif';
      ctx.fillText('Record: ' + highScore, 10, 60);

      ctx.drawImage(coinPanelImg, COIN_PANEL_X, COIN_PANEL_Y, COIN_PANEL_W, COIN_PANEL_H);
      ctx.drawImage(coinImg, COIN_PANEL_X + 8, COIN_PANEL_Y + 5, 30, 30);

      ctx.fillStyle = 'white';
      ctx.font = 'bold 22px sans-serif';
      ctx.textAlign = 'left';
      ctx.fillText(coinsTotal, COIN_PANEL_X + 45, COIN_PANEL_Y + 28);

      if (paused) {
        ctx.drawImage(playBtnImg, 175, 0, 50, 50);
      } else {
        ctx.drawImage(pauseBtnImg, 175, 0, 50, 50);
      }

      if (musicOn) {
        ctx.drawImage(musicOnImg, 235, 0, 50, 50);
      } else {
        ctx.drawImage(musicOffImg, 235, 0, 50, 50);
      }

      const settingsBtnX = 300;
      const settingsBtnY = 0;
      const settingsHover = (mouseX >= settingsBtnX && mouseX <= settingsBtnX + BTN_SIZE &&
                             mouseY >= settingsBtnY && mouseY <= settingsBtnY + BTN_SIZE);

      if (settingsHover) {
        ctx.drawImage(settingsBtnHoverImg, settingsBtnX, settingsBtnY, BTN_SIZE, BTN_SIZE);
      } else {
        ctx.drawImage(settingsBtnImg, settingsBtnX, settingsBtnY, BTN_SIZE, BTN_SIZE);
      }

      ctx.globalAlpha = 0.6;

      const hoverLeftBtn = (mouseX >= 15 && mouseX <= 115 &&
                            mouseY >= 485 && mouseY <= 585);
      const hoverRightBtn = (mouseX >= 285 && mouseX <= 385 &&
                             mouseY >= 485 && mouseY <= 585);

      if (hoverLeftBtn) {
        ctx.drawImage(btnLeftHoverImg, 15, 485, 100, 100);
      } else {
        ctx.drawImage(btnLeftImg, 15, 485, 100, 100);
      }

      if (hoverRightBtn) {
        ctx.drawImage(btnRightHoverImg, 285, 485, 100, 100);
      } else {
        ctx.drawImage(btnRightImg, 285, 485, 100, 100);
      }

      ctx.globalAlpha = 1;

      if (fadingIn) {
        fadeAlpha = fadeAlpha - 0.05;
        if (fadeAlpha <= 0) {
          fadeAlpha = 0;
          fadingIn = false;
        }
        if (fadeAlpha > 0) {
          ctx.fillStyle = 'rgba(0, 0, 0, ' + fadeAlpha + ')';
          ctx.fillRect(0, 0, 400, 600);
        }
      }

      requestAnimationFrame(loop);
    }

    function triggerGameOver() {
      if (gameOver) return;
      gameOver = true;
      gameOverTimer = 0;
      canvas.style.filter = 'blur(6px) brightness(0.5)';

      gamesPlayed = gamesPlayed + 1;
      saveStats();

      if (Math.floor(score) > startHighScore) {
        isNewRecord = true;
        playRecordSound();
      } else {
        isNewRecord = false;
        playGameOverSound();
      }
    }

    requestAnimationFrame(loop);
  </script>
